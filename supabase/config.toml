# Gateway JWT verification is disabled because the function also exposes a
# one-time bootstrap action without a user session. Every non-bootstrap action
# validates the Supabase bearer token and an active ADMINISTRATOR profile in
# code before using the service-role client.
[functions.admin-users]
verify_jwt = false

# `create-reservation` aceita pedidos sem sessão (hóspedes não autenticados) e
# valida a entrada em código antes de usar o service-role client.
[functions.create-reservation]
verify_jwt = false
